<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&T Bot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/pics/d&amp;t-icon.png" class="sidebar-logo-img" alt="D&T">
                <span class="sidebar-brand">D&T Dashboard</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-category">General</div>
                <a href="#" class="nav-item active" data-tab="overview">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-tab="logs">
                    <span class="nav-icon"><i class="fa-solid fa-newspaper"></i></span>
                    <span>Logs</span>
                </a>

                <div class="nav-category">Automation</div>
                <a href="#" class="nav-item" data-tab="welcomer">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
                    <span>Welcomer</span>
                </a>
                <a href="#" class="nav-item" data-tab="autoresponder">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                    <span>Auto-Responder</span>
                </a>
                <a href="#" class="nav-item" data-tab="roles">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <span>Roles</span>
                </a>

                <div class="nav-category">Protection</div>
                <a href="#" class="nav-item" data-tab="automod">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                    <span>AutoMod</span>
                </a>
                <a href="#" class="nav-item" data-tab="moderation">
                    <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
                    <span>Moderation</span>
                </a>
                <a href="#" class="nav-item" data-tab="security">
                    <span class="nav-icon"><i class="fa-solid fa-lock"></i></span>
                    <span>Security</span>
                </a>

                <div class="nav-category">Tools</div>
                <a href="#" class="nav-item" data-tab="embed">
                    <span class="nav-icon"><i class="fa-solid fa-paper-plane"></i></span>
                    <span>Sender</span>
                </a>
                <a href="#" class="nav-item" data-tab="tickets">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a2 2 0 1 0 0 4v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1a2 2 0 1 0 0-4V9z"/><line x1="8" y1="9" x2="8" y2="15" opacity=".5"/><line x1="16" y1="9" x2="16" y2="15" opacity=".5"/></svg></span>
                    <span>Tickets</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span class="bot-status {{ 'status-online' if session.get('bot_status') == 'Online' else 'status-offline' }}"></span>
                <span id="sidebarStatus">Offline</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    async function fetchStats() {
        try {
            const r = await fetch('/api/stats');
            const data = await r.json();
            document.getElementById('sidebarStatus').textContent = data.status;
            document.querySelector('.bot-status').className = 'bot-status ' + (data.status === 'Online' ? 'status-online' : 'status-offline');
            const st = document.getElementById('statStatus');
            if (st) st.textContent = data.status;
            const mc = document.getElementById('statMembers');
            if (mc) mc.textContent = data.member_count;
            const gn = document.getElementById('statGuild');
            if (gn) gn.textContent = data.guild_name;
            const pg = document.getElementById('statPing');
            if (pg) pg.textContent = data.ping_ms + 'ms';
            const nm = document.getElementById('statNewMembers');
            if (nm) nm.textContent = data.new_members_24h;
            const ms = document.getElementById('statMessages24h');
            if (ms) ms.textContent = data.messages_24h;
            const cu = document.getElementById('statCpu');
            if (cu) cu.textContent = data.cpu_pct + '%';
            const rm = document.getElementById('statRam');
            if (rm) rm.textContent = data.ram_pct + '%';
        } catch(e) {}
    }

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const tab = this.dataset.tab;
            const panel = document.getElementById('tab-' + tab);
            if (panel) panel.classList.add('active');
        });
    });

    fetchStats();
    setInterval(fetchStats, 10000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
