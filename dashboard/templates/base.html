<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&T Bot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/pics/d&amp;t-icon.png" class="sidebar-logo-img" alt="D&T">
                <span class="sidebar-brand">D&T Dashboard</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-category">General</div>
                <a href="#" class="nav-item active" data-tab="overview">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><line x1="10" y1="6.5" x2="14" y2="6.5" stroke-width="1.2" opacity=".4"/><line x1="6.5" y1="10" x2="6.5" y2="14" stroke-width="1.2" opacity=".4"/><line x1="17.5" y1="10" x2="17.5" y2="14" stroke-width="1.2" opacity=".4"/><line x1="10" y1="17.5" x2="14" y2="17.5" stroke-width="1.2" opacity=".4"/></svg></span>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item" data-tab="logs">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6" opacity=".6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><circle cx="10" cy="9" r="1" fill="currentColor"/><path d="M8 13v4" opacity=".4"/><path d="M16 13v4" opacity=".4"/></svg></span>
                    <span>Logs</span>
                </a>

                <div class="nav-category">Automation</div>
                <a href="#" class="nav-item" data-tab="welcomer">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M17 8l2 2 4-4"/><path d="M16 21v-2a4 4 0 0 0-4-4H9" opacity=".4"/><path d="M19 3a3 3 0 0 1 0 6h-2" stroke-width="1.4" opacity=".6"/></svg></span>
                    <span>Welcomer</span>
                </a>
                <a href="#" class="nav-item" data-tab="autoresponder">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="12" cy="10" r="1.5" fill="currentColor" opacity=".8"/><circle cx="16" cy="10" r="1.5" fill="currentColor" opacity=".8"/><circle cx="8" cy="10" r="1.5" fill="currentColor" opacity=".8"/><path d="M7 14h10" opacity=".5"/></svg></span>
                    <span>Auto-Responder</span>
                </a>
                <a href="#" class="nav-item" data-tab="roles">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6" r="3"/><circle cx="17" cy="7" r="2.5"/><path d="M3 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M18 20v-2a3 3 0 0 0-2-2.82" opacity=".6"/><path d="M13.5 6.5l3 .5" opacity=".5"/><circle cx="17" cy="7" r="1" fill="currentColor" opacity=".5"/></svg></span>
                    <span>Roles</span>
                </a>

                <div class="nav-category">Protection</div>
                <a href="#" class="nav-item" data-tab="automod">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10" stroke-width="2.2"/><line x1="4" y1="5" x2="20" y2="5" opacity=".3" stroke-width="1"/><circle cx="12" cy="12" r="6" opacity=".1" fill="currentColor"/></svg></span>
                    <span>AutoMod</span>
                </a>
                <a href="#" class="nav-item" data-tab="moderation">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                    <span>Moderation</span>
                </a>
                <a href="#" class="nav-item" data-tab="security">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.5" fill="currentColor" opacity=".8"/><line x1="12" y1="16" x2="12" y2="13" opacity=".6"/><circle cx="12" cy="7" r="2" opacity=".3" stroke-width="1.2"/></svg></span>
                    <span>Security</span>
                </a>

                <div class="nav-category">Tools</div>
                <a href="#" class="nav-item" data-tab="embed">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 2 15 22 11 13 2 9 22 2" stroke-width="1.8"/><circle cx="14" cy="10" r="1.5" fill="currentColor" opacity=".6"/><path d="M18 6l-4 4" opacity=".5"/><line x1="11" y1="13" x2="8" y2="9" opacity=".5"/></svg></span>
                    <span>Sender</span>
                </a>
                <a href="#" class="nav-item" data-tab="tickets">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M9 10v4" opacity=".6"/><path d="M15 10v4" opacity=".6"/><path d="M12 10v6" opacity=".6"/><path d="M7 18h10" opacity=".4"/><circle cx="12" cy="14" r="2" fill="currentColor" opacity=".15"/></svg></span>
                    <span>Tickets</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span class="bot-status {{ 'status-online' if session.get('bot_status') == 'Online' else 'status-offline' }}"></span>
                <span id="sidebarStatus">Offline</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    async function fetchStats() {
        try {
            const r = await fetch('/api/stats');
            const data = await r.json();
            document.getElementById('sidebarStatus').textContent = data.status;
            document.querySelector('.bot-status').className = 'bot-status ' + (data.status === 'Online' ? 'status-online' : 'status-offline');
            const st = document.getElementById('statStatus');
            if (st) st.textContent = data.status;
            const mc = document.getElementById('statMembers');
            if (mc) mc.textContent = data.member_count;
            const gn = document.getElementById('statGuild');
            if (gn) gn.textContent = data.guild_name;
            const pg = document.getElementById('statPing');
            if (pg) pg.textContent = data.ping_ms + 'ms';
            const nm = document.getElementById('statNewMembers');
            if (nm) nm.textContent = data.new_members_24h;
            const ms = document.getElementById('statMessages24h');
            if (ms) ms.textContent = data.messages_24h;
            const cu = document.getElementById('statCpu');
            if (cu) cu.textContent = data.cpu_pct + '%';
            const rm = document.getElementById('statRam');
            if (rm) rm.textContent = data.ram_pct + '%';
        } catch(e) {}
    }

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const tab = this.dataset.tab;
            const panel = document.getElementById('tab-' + tab);
            if (panel) panel.classList.add('active');
        });
    });

    fetchStats();
    setInterval(fetchStats, 10000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
